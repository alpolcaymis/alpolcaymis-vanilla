  <body>
    <!-- === NAVBAR === -->
    <nav class="navbar">
      <div class="nav-wrapper">
        <a href="index.html">
          <img

    <!-- === İLETİŞİM FORMU === -->
    <div class="container">
      <h1>İletişim</h1>

      <form id="contactForm">
        <fieldset>
          <legend>Mesajınızı Bize Ulaştırın</legend>

          <label for="name">Adınız</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Adınız"
            required
          />

          <label for="email">E-posta</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="ornek@mail.com"
            required
          />

          <label for="message">Mesajınız</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Mesajınızı buraya yazın..."
            required
          ></textarea>

          <button type="submit">Gönder</button>
        </fieldset>
      </form>

      <p style="text-align: center; margin-top: 30px">
        🔙 <a href="index.html">Ana sayfaya dön</a>
      </p>
    </div>
